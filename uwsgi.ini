[uwsgi]
# ── App ──
module = wsgi:app
master = true
pythonpath = /home/llppmmss/lpms
chdir = /home/llppmmss/lpms
virtualenv = /home/llppmmss/lpms/.venv

# ── Workers ──
processes = 2
threads = 4
buffer-size = 32768

# ── Socket ──
socket = /run/aipclpms.sock
chmod-socket = 666
die-on-term = true

# ── Memory management ──
max-requests = 200
max-requests-delta = 50
harakiri = 300
harakiri-verbose = true

# ── Logging ──
log-format = %(addr) - %(user) [%(ltime)] "%(method) %(uri) %(proto)" %(status) %(size)
