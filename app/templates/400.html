{% extends "base.html" %}

{% block title %}Bad Request - {{ institution_name }}{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4">
    <div class="mb-8">
        <div class="relative inline-block">
            <div class="w-32 h-32 bg-indigo-100 dark:bg-indigo-900/30 rounded-full flex items-center justify-center animate-pulse">
                <svg class="w-16 h-16 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
            </div>
            <div class="absolute -bottom-2 -right-2 w-12 h-12 bg-white dark:bg-gray-800 rounded-2xl shadow-lg flex items-center justify-center border border-gray-100 dark:border-gray-700">
                <span class="text-xl font-black text-gray-900 dark:text-white">400</span>
            </div>
        </div>
    </div>
    
    <h1 class="text-4xl font-black text-gray-900 dark:text-white mb-4 tracking-tighter uppercase">Bad Request</h1>
    <p class="text-lg text-gray-500 dark:text-gray-400 max-w-md mx-auto mb-10 leading-relaxed font-medium">
        Something went wrong with your request. This often happens if your session has expired or the security token is missing.
    </p>
    
    <div class="flex flex-col sm:flex-row gap-4">
        <a href="{{ url_for('main.dashboard') }}" class="px-8 py-4 bg-indigo-600 text-white font-black rounded-2xl shadow-xl shadow-indigo-200 dark:shadow-none hover:bg-indigo-700 transition-all transform active:scale-95 uppercase tracking-widest text-sm">
            Go to Dashboard
        </a>
        <a href="{{ url_for('auth.login') }}" class="px-8 py-4 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 font-bold rounded-2xl border border-gray-200 dark:border-gray-700 hover:bg-gray-50 transition-all transform active:scale-95 uppercase tracking-widest text-sm">
            Sign In Again
        </a>
    </div>
</div>
{% endblock %}
